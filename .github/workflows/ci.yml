name: MineMate
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: minemate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Tag must match package.json version")'
      - run: npm ci
      - run: npm run check
      - run: npm run test:docker
      - run: docker build --tag minemate:compose-test .
      - run: npm run test:compose
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  image:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/elias02345/minemate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/elias02345/minemate
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and latest manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          refs=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            refs+=("$IMAGE@sha256:$digest")
          done
          [ "${#refs[@]}" -eq 2 ]
          docker buildx imagetools create --tag "$IMAGE:${GITHUB_REF_NAME#v}" --tag "$IMAGE:latest" "${refs[@]}"
      - name: Verify public installation without a registry login
        run: |
          public_config="$(mktemp -d)"
          if ! DOCKER_CONFIG="$public_config" docker pull "$IMAGE:${GITHUB_REF_NAME#v}"; then
            echo '::error::Set the MineMate GHCR package visibility to Public at https://github.com/users/Elias02345/packages/container/minemate/settings, then rerun this job.'
            exit 1
          fi
      - name: Publish downloadable Compose release
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Install the prebuilt MineMate image with Docker Compose. Download docker-compose.yml and default.env.example, rename the latter to .env and set your Docker host LAN address, then run docker compose up -d --wait. No Git checkout, Node installation or local image build is needed.

          The image supports linux/amd64 and linux/arm64. Native Bedrock servers require amd64. See README.md and docs/VALIDATION.md for runtime coverage and limitations.
          NOTES
          cp .env.example "$RUNNER_TEMP/default.env.example"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" docker-compose.yml "$RUNNER_TEMP/default.env.example" --clobber
          else
            gh release create "$GITHUB_REF_NAME" docker-compose.yml "$RUNNER_TEMP/default.env.example" --verify-tag --title "MineMate ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Verify public configuration downloads
        run: |
          release="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/released-compose.yml" "$release/docker-compose.yml"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/released.env" "$release/default.env.example"
          cmp docker-compose.yml "$RUNNER_TEMP/released-compose.yml"
          cmp .env.example "$RUNNER_TEMP/released.env"
